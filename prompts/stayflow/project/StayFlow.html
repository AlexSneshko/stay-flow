          el('div', { class:'field-label' }, 'Currency'),
          el('select', { class:'input', onchange:(e) => { m.currency = e.target.value; } },
            ...Object.keys(CURRENCIES).map(c => el('option', { value:c, selected: c === m.currency }, c))),
        ),
      ),
      el('div', { class:'field' },
        el('div', { class:'field-label' }, 'Note'),
        el('textarea', { class:'input', placeholder:'Tell me...',
          oninput:(e) => { m.note = e.target.value; } }, m.note),
      ),
    ),
    el('div', { class:'modal-foot' },
      el('div', { class:'modal-foot-left' },
        m.id ? el('button', { class:'btn btn-ghost', style:{ color:'var(--expense)' },
          onclick: () => {
            state.transactions = state.transactions.filter(t => t.id !== m.id);
            saveState(); closeModal(); toast('Transaction deleted', 'info'); render();
          }}, elHtml(I.trash), 'Delete') : null,
      ),
      el('div', { class:'modal-foot-right' },
        el('button', { class:'btn btn-ghost', onclick: closeModal }, 'Cancel'),
        el('button', { class:'btn btn-primary', onclick: saveTxn }, m.id ? 'Update' : 'Save transaction'),
      ),
    ),
  );
  return modal;
}

function saveTxn() {
  const m = state.ui.modal;
  if (!m.amount || m.amount <= 0) { toast('Enter an amount','error'); return; }
  if (m.id) {
    const idx = state.transactions.findIndex(t => t.id === m.id);
    if (idx >= 0) {
      state.transactions[idx] = {
        ...state.transactions[idx],
        amount: m.amount, type: m.type, categorySlug: m.categorySlug,
        currency: m.currency, note: m.note, date: m.date,
      };
      toast('Transaction updated');
    }
  } else {
    state.transactions.push({
      id: uid(), amount: m.amount, type: m.type, categorySlug: m.categorySlug,
      currency: m.currency, note: m.note || '', date: m.date,
      status: 'CONFIRMED', recurringId: null,
      createdAt: new Date().toISOString(),
    });
    toast('Transaction saved');
  }
  saveState(); closeModal(); render();
}

/* Recurring modal */
function openRecurringModal(existing = null) {
  state.ui.modal = {
    kind:'recurring',
    id: existing?.id || null,
    title: existing?.title || '',
    amount: existing?.amount || 0,
    type: existing?.type || 'EXPENSE',
    categorySlug: existing?.categorySlug || 'subscriptions',
    currency: existing?.currency || state.settings.currency,
    frequency: existing?.frequency || 'MONTHLY',
    dayOfMonth: existing?.dayOfMonth || new Date().getDate(),
    nextDueDate: existing?.nextDueDate || todayIso(),
    active: existing?.active ?? true,
  };
  renderModal();
}
function renderRecurringModal(m) {
  const title = m.id ? 'Edit recurring transaction' : 'New recurring transaction';
  const amountInput = el('input', {
    class:'amount-input ' + (m.type === 'INCOME' ? 'income' : 'expense'),
    type:'text', value: formatAmountInput(m.amount, m.type),
    oninput: (e) => {
      const digits = e.target.value.replace(/\D/g, '');
      m.amount = parseInt(digits || '0', 10);
      e.target.value = formatAmountInput(m.amount, m.type);
      const len = e.target.value.length;
      e.target.setSelectionRange(len, len);
    }
  });

  const pillsWrap = el('div', { class:'cat-pills' });
  function redraw() {
    pillsWrap.innerHTML = '';
    const filtered = state.categories.filter(c => (c.type === m.type || c.type === 'BOTH') && c.type !== 'TASK').sort((a,b)=>(a.order||0)-(b.order||0));
    if (!filtered.find(c => c.slug === m.categorySlug)) m.categorySlug = filtered[0]?.slug;
    filtered.forEach(c => {
      const active = c.slug === m.categorySlug;
      pillsWrap.appendChild(el('button', {
        class:'cat-pill' + (active ? ' active' : ''),
        style: active ? { background: c.color } : {},
        onclick: () => { m.categorySlug = c.slug; redraw(); }
      }, el('span', {}, c.icon), el('span', {}, c.name)));
    });
  }
  redraw();

  const freqs = ['DAILY','WEEKLY','MONTHLY','YEARLY'];
  const freqsWrap = el('div', { class:'freq-pills' });
  const dayOfMonthField = el('div', { class:'field' },
    el('div', { class:'field-label' }, 'Day of month'),
    el('input', { class:'input', type:'number', min:'1', max:'31', value: m.dayOfMonth || '',
      placeholder:'e.g. 15',
      oninput:(e)=>{ const n = parseInt(e.target.value,10); m.dayOfMonth = (n>=1 && n<=31) ? n : null; }}),
  );
  function syncDayOfMonth() {
    dayOfMonthField.style.display = m.frequency === 'MONTHLY' ? '' : 'none';
  }
  function redrawFreqs() {
    freqsWrap.innerHTML = '';
    freqs.forEach(f => freqsWrap.appendChild(el('button', {
      class:'freq-pill' + (m.frequency === f ? ' active' : ''),
      onclick: () => { m.frequency = f; redrawFreqs(); syncDayOfMonth(); }
    }, f.charAt(0) + f.slice(1).toLowerCase())));
  }
  redrawFreqs();
  syncDayOfMonth();

  function setRecType(newType) {
    m.type = newType;
    amountInput.className = 'amount-input ' + (newType === 'INCOME' ? 'income' : 'expense');
    amountInput.value = formatAmountInput(m.amount, newType);
    $$('.tx-tab', modal).forEach(b => {
      const isIncome = b.dataset.type === 'INCOME';
      b.classList.toggle('active', (isIncome && newType === 'INCOME') || (!isIncome && newType === 'EXPENSE'));
    });
    redraw();
  }

  const modal = el('div', { class:'modal', onclick:(e)=>e.stopPropagation() },
    el('div', { class:'modal-head' },
      el('div', { class:'modal-title' }, title),
      el('button', { class:'icon-btn', onclick: closeModal }, elHtml(I.close)),
    ),
    el('div', { class:'modal-body' },
      el('div', { class:'field', style:{ marginTop:'14px' } },
        el('div', { class:'field-label' }, 'Subscription name'),
        el('input', { class:'input', type:'text', value:m.title, placeholder:'e.g. Netflix',
          oninput:(e)=>{m.title=e.target.value;}}),
      ),
      el('div', { class:'tx-tabs', style:{ margin:'14px 0 8px' } },
        el('button', { class:'tx-tab income' + (m.type==='INCOME'?' active':''), 'data-type':'INCOME', onclick:() => setRecType('INCOME') }, 'Income'),
        el('button', { class:'tx-tab expense' + (m.type==='EXPENSE'?' active':''), 'data-type':'EXPENSE', onclick:() => setRecType('EXPENSE') }, 'Expense'),
      ),
      el('div', { class:'amount-input-wrap' }, amountInput),
      el('div', { class:'field' },
        el('div', { class:'field-label' }, 'Category'),
        pillsWrap,
      ),
      el('div', { class:'field' },
        el('div', { class:'field-label' }, 'Frequency'),
        freqsWrap,
      ),
      dayOfMonthField,
      el('div', { class:'field-row' },
        el('div', {},
          el('div', { class:'field-label' }, 'First due date'),
          el('input', { class:'input', type:'date', value:m.nextDueDate,
            onchange:(e)=>{m.nextDueDate=e.target.value;}}),
        ),
        el('div', {},
          el('div', { class:'field-label' }, 'Currency'),
          el('select', { class:'input', onchange:(e)=>{m.currency=e.target.value;}},
            ...Object.keys(CURRENCIES).map(c => el('option', { value:c, selected:c===m.currency }, c))),
        ),
      ),
    ),
    el('div', { class:'modal-foot' },
      el('div', { class:'modal-foot-left' },
        m.id ? el('button', { class:'btn btn-ghost', style:{ color:'var(--expense)' },
          onclick: () => {
            if (confirm('Delete this recurring?')) {
              state.recurring = state.recurring.filter(r => r.id !== m.id);
              saveState(); closeModal(); toast('Recurring deleted','info'); render();
            }
          }}, elHtml(I.trash), 'Delete') : null,
      ),
      el('div', { class:'modal-foot-right' },
        el('button', { class:'btn btn-ghost', onclick:closeModal }, 'Cancel'),
        el('button', { class:'btn btn-primary', onclick:saveRecurring }, m.id ? 'Update' : 'Save recurring'),
      ),
    ),
  );
  return modal;
}
function saveRecurring() {
  const m = state.ui.modal;
  if (!m.title.trim()) { toast('Add a title','error'); return; }
  if (!m.amount) { toast('Enter an amount','error'); return; }
  const dom = m.frequency === 'MONTHLY'
    ? (m.dayOfMonth || parseIso(m.nextDueDate).getDate())
    : parseIso(m.nextDueDate).getDate();
  if (m.id) {
    const idx = state.recurring.findIndex(r=>r.id===m.id);
    if (idx >= 0) state.recurring[idx] = { ...state.recurring[idx],
      title: m.title, amount: m.amount, type: m.type, categorySlug: m.categorySlug,
      currency: m.currency, frequency: m.frequency, nextDueDate: m.nextDueDate,
      dayOfMonth: dom };
    toast('Recurring updated');
  } else {
    state.recurring.push({
      id: uid(), title: m.title, amount: m.amount, type: m.type,
      categorySlug: m.categorySlug, currency: m.currency, frequency: m.frequency,
      dayOfMonth: dom, nextDueDate: m.nextDueDate,
      active: true, createdAt: new Date().toISOString(),
    });
    toast('Recurring saved');
  }
  saveState(); closeModal(); render();
}

/* Task modal */
function openTaskModal(existing = null) {
  state.ui.modal = {
    kind:'task',
    id: existing?.id || null,
    title: existing?.title || '',
    notes: existing?.notes || '',
    dueDate: existing?.dueDate || '',
    priority: existing?.priority || 'med',
    linkedCategory: existing?.linkedCategory || null,
    amount: existing?.amount || 0,
    isPinned: existing?.isPinned || false,
    timeFrom: existing?.timeFrom || '',
    timeTo: existing?.timeTo || '',
    completed: existing?.completed || false,
    completedAt: existing?.completedAt || null,
    pinHistory: existing?.pinHistory || {},
    createdAt: existing?.createdAt || null,
  };
  renderModal();
  setTimeout(() => { const i = $('#task-title-input'); i && i.focus(); }, 50);
}

function renderTaskModal(m) {
  const title = m.id ? 'Edit task' : 'New task';

  const priorityWrap = el('div', { class:'freq-pills' });
  function redrawPri() {
    priorityWrap.innerHTML = '';
    [['urgent','Urgent'],['high','High'],['med','Medium'],['low','Low']].forEach(([v, label]) => {
      priorityWrap.appendChild(el('button', {
        class: 'priority-pill ' + v + (m.priority === v ? ' active ' + v : ''),
        onclick: () => { m.priority = v; redrawPri(); }
      }, el('span', { class:'priority-dot ' + v }), label));
    });
  }
  redrawPri();

  // Task-specific categories (from sf_task_categories)
  const taskCats = state.taskCategories.slice().sort((a,b) => (a.order||0)-(b.order||0));
  const catWrap = el('div', { class:'cat-pills' });
  function redrawCats() {
    catWrap.innerHTML = '';
    catWrap.appendChild(el('button', {
      class:'cat-pill' + (!m.linkedCategory ? ' active' : ''),
      style: !m.linkedCategory ? { background:'var(--text-secondary)', color:'var(--bg-page)' } : {},
      onclick:() => { m.linkedCategory = null; redrawCats(); }
    }, el('span', {}, '—'), el('span', {}, 'No link')));
    taskCats.forEach(c => {
      const active = c.slug === m.linkedCategory;
      catWrap.appendChild(el('button', {
        class:'cat-pill' + (active ? ' active' : ''),
        style: active ? { background: c.color } : {},
        onclick:() => { m.linkedCategory = c.slug; redrawCats(); }
      }, el('span', {}, c.icon), el('span', {}, c.name)));
    });
  }
  redrawCats();

  const amountInput = el('input', {
    class:'input', type:'text', value: m.amount ? formatAmountInput(m.amount, 'EXPENSE').replace(/^[+−]/, '') : '',
    placeholder: 'Optional',
    oninput: (e) => {
      const digits = e.target.value.replace(/\D/g, '');
      m.amount = parseInt(digits || '0', 10);
      e.target.value = m.amount ? formatAmountInput(m.amount, 'EXPENSE').replace(/^[+−]/, '') : '';
    }
  });

  const pinSwitch = el('div', {
    class: 'switch' + (m.isPinned ? ' on' : ''),
    onclick: () => {
      m.isPinned = !m.isPinned;
      pinSwitch.classList.toggle('on', m.isPinned);
    }
  });

  return el('div', { class:'modal', onclick:(e)=>e.stopPropagation() },
    el('div', { class:'modal-head' },
      el('div', { class:'modal-title' }, title),
      el('button', { class:'icon-btn', onclick:closeModal }, elHtml(I.close)),
    ),
    el('div', { class:'modal-body' },
      el('div', { class:'field', style:{ marginTop:'14px' } },
        el('div', { class:'field-label' }, 'Task'),
        el('input', { id:'task-title-input', class:'input', type:'text', value: m.title,
          placeholder:'e.g. Move $500 to savings',
          oninput:(e)=>{m.title = e.target.value;},
          onkeydown:(e)=>{ if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveTask(); }
        }),
      ),
      el('div', { class:'field-row' },
        el('div', {},
          el('div', { class:'field-label' }, 'Due date'),
          el('input', { class:'input', type:'date', value: m.dueDate || '',
            onchange:(e)=>{ m.dueDate = e.target.value || null; }
          }),
        ),
        el('div', {},
          el('div', { class:'field-label' }, 'Tracked amount'),
          amountInput,
        ),
      ),
      el('div', { class:'field' },
        el('div', { class:'field-label' }, 'Priority'),
        priorityWrap,
      ),
      el('div', { class:'toggle-row' },
        el('div', { style:{ flex:1, minWidth:0 } },
          el('div', { class:'toggle-row-label' }, 'Repeat every day'),
          el('div', { class:'toggle-row-sub' }, 'This task will appear daily until removed'),
        ),
        pinSwitch,
      ),
      el('div', { class:'field' },
        el('div', { class:'field-label' }, 'Time range (optional)'),
        el('div', { class:'time-input-row' },
          el('input', { class:'input', type:'time', value: m.timeFrom || '',
            placeholder:'09:00',
            onchange:(e)=>{ m.timeFrom = e.target.value || ''; }}),
          el('input', { class:'input', type:'time', value: m.timeTo || '',
            placeholder:'10:00',
            onchange:(e)=>{ m.timeTo = e.target.value || ''; }}),
        ),
      ),
      el('div', { class:'field' },
        el('div', { class:'field-label' }, 'Link to category'),
        catWrap,
      ),
      el('div', { class:'field' },
        el('div', { class:'field-label' }, 'Notes'),
        el('textarea', { class:'input', placeholder:'Optional context...',
          oninput:(e)=>{m.notes = e.target.value;}}, m.notes || ''),
      ),
    ),
    el('div', { class:'modal-foot' },
      el('div', { class:'modal-foot-left' },
        m.id ? el('button', { class:'btn btn-ghost', style:{ color:'var(--expense)' },
          onclick: () => {
            if (confirm('Delete this task?')) {
              state.tasks = state.tasks.filter(t => t.id !== m.id);
              saveState(); closeModal(); toast('Task deleted','info'); render();
            }
          }}, elHtml(I.trash), 'Delete') : null,
      ),
      el('div', { class:'modal-foot-right' },
        el('button', { class:'btn btn-ghost', onclick:closeModal }, 'Cancel'),
        el('button', { class:'btn btn-primary', onclick:saveTask }, m.id ? 'Update' : 'Save task'),
      ),
    ),
  );
}

function saveTask() {
  const m = state.ui.modal;
  if (!m.title.trim()) { toast('Add a task title','error'); return; }
  if (m.id) {
    const idx = state.tasks.findIndex(t => t.id === m.id);
    if (idx >= 0) {
      state.tasks[idx] = {
        ...state.tasks[idx],
        title: m.title.trim(), notes: m.notes, dueDate: m.dueDate || null,
        priority: m.priority, linkedCategory: m.linkedCategory,
        amount: m.amount || null,
        isPinned: !!m.isPinned,
        timeFrom: m.timeFrom || null,
        timeTo: m.timeTo || null,
      };
      toast('Task updated');
    }
  } else {
    state.tasks.push({
      id: uid(), title: m.title.trim(), notes: m.notes, dueDate: m.dueDate || null,
      priority: m.priority, linkedCategory: m.linkedCategory,
      amount: m.amount || null, completed: false, completedAt: null,
      isPinned: !!m.isPinned,
      timeFrom: m.timeFrom || null,
      timeTo: m.timeTo || null,
      pinHistory: {},
      createdAt: new Date().toISOString(),
    });
    toast('Task saved');
  }
  saveState(); closeModal(); render();
}

/* Category modal */
function openCategoryModal(existing, isTask=false) {
  state.ui.modal = {
    kind:'category',
    isTask: !!isTask,
    slug: existing?.slug || null,
    name: existing?.name || '',
    icon: existing?.icon || (isTask ? '📋' : '🎯'),
    color: existing?.color || '#e8a44a',
    type: existing?.type || (isTask ? 'TASK' : state.ui.catTab),
  };
  renderModal();
}
function renderCategoryModal(m) {
  const colors = ['#e8a44a','#5b8def','#2f9d8a','#8a6bc8','#c73e3e','#47a373','#c7943e','#6b6a63'];

  const iconInput = el('input', {
    class:'input', type:'text', value: m.icon || '',
    placeholder: m.isTask ? '📋' : '🎯',
    maxlength: 4,
    style:{ textAlign:'center', fontSize:'20px' },
    oninput: (e) => {
      m.icon = e.target.value;
      const preview = $('#cat-modal-preview');
      if (preview) preview.textContent = m.icon || (m.isTask ? '📋' : '🎯');
    }
  });

  const colorWrap = el('div', { class:'swatch-row' });
  colors.forEach(c => colorWrap.appendChild(el('div', {
    class: 'swatch' + (m.color === c ? ' active' : ''),
    style:{ background:c }, onclick:() => { m.color = c; renderModal(); }
  }, elHtml(I.check))));

  const typeRow = m.isTask
    ? null
    : el('div', { class:'field' },
        el('div', { class:'field-label' }, 'Type'),
        el('div', { class:'freq-pills' },
          el('button', { class:'freq-pill' + (m.type==='EXPENSE'?' active':''), onclick:() => { m.type='EXPENSE'; renderModal(); } }, 'Expense'),
          el('button', { class:'freq-pill' + (m.type==='INCOME'?' active':''), onclick:() => { m.type='INCOME'; renderModal(); } }, 'Income'),
          el('button', { class:'freq-pill' + (m.type==='BOTH'?' active':''), onclick:() => { m.type='BOTH'; renderModal(); } }, 'Both'),
        ),
      );

  return el('div', { class:'modal', onclick:(e)=>e.stopPropagation() },
    el('div', { class:'modal-head' },
      el('div', { class:'modal-title' }, m.slug ? 'Edit category' : 'New category'),
      el('button', { class:'icon-btn', onclick:closeModal }, elHtml(I.close)),
    ),
    el('div', { class:'modal-body' },
      el('div', { style:{ display:'flex', alignItems:'center', gap:'14px', margin:'14px 0 20px' } },
        el('div', { id:'cat-modal-preview', class:'cat-circle', style:{ width:'52px', height:'52px', borderRadius:'14px', fontSize:'22px', background: m.color } }, m.icon || (m.isTask ? '📋' : '🎯')),
        el('div', { style:{ flex:1 } },
          el('div', { class:'field-label' }, 'Name'),
          el('input', { class:'input', type:'text', value:m.name,
            placeholder: m.isTask ? 'e.g. Errands, Reading' : 'e.g. Pets, Hobbies',
            oninput:(e)=>{m.name=e.target.value;}}),
        ),
      ),
      el('div', { class:'field' },
        el('div', { class:'field-label' }, 'Icon (any emoji)'),
        iconInput,
      ),
      el('div', { class:'field' },
        el('div', { class:'field-label' }, 'Color'),
        colorWrap,
      ),
      typeRow,
    ),
    el('div', { class:'modal-foot' },
      el('div', { class:'modal-foot-left' }),
      el('div', { class:'modal-foot-right' },
        el('button', { class:'btn btn-ghost', onclick:closeModal }, 'Cancel'),
        el('button', { class:'btn btn-primary', onclick:saveCategory }, m.slug ? 'Update' : 'Save category'),
      ),
    ),
  );
}
function saveCategory() {
  const m = state.ui.modal;
  if (!m.name.trim()) { toast('Add a name','error'); return; }
  if (!m.icon.trim()) { toast('Add an icon emoji','error'); return; }
  if (m.isTask) {
    if (m.slug) {
      const idx = state.taskCategories.findIndex(c=>c.slug===m.slug);
      if (idx >= 0) state.taskCategories[idx] = { ...state.taskCategories[idx], name:m.name, icon:m.icon, color:m.color };
      toast('Task category updated');
    } else {
      const baseSlug = m.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || uid();
      let slug = baseSlug, i = 1;
      while (state.taskCategories.find(c=>c.slug===slug)) { slug = baseSlug + '-' + (++i); }
      state.taskCategories.push({ slug, name:m.name, icon:m.icon, color:m.color, type:'TASK', isDefault:false, order: state.taskCategories.length });
      toast('Task category saved');
    }
  } else {
    if (m.slug) {
      const idx = state.categories.findIndex(c=>c.slug===m.slug);
      if (idx >= 0) state.categories[idx] = { ...state.categories[idx], name:m.name, icon:m.icon, color:m.color, type:m.type };
      toast('Category updated');
    } else {
      const baseSlug = m.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || uid();
      let slug = baseSlug, i = 1;
      while (state.categories.find(c=>c.slug===slug)) { slug = baseSlug + '-' + (++i); }
      state.categories.push({ slug, name:m.name, icon:m.icon, color:m.color, type:m.type, isDefault:false, order: state.categories.length });
      toast('Category saved');
    }
  }
  saveState(); closeModal(); render();
}

/* ============================================================
   INIT
   ============================================================ */
function routeFromHash() {
  const h = (location.hash || '#dashboard').slice(1);
  const valid = ['dashboard','finance','tasks','recurring','categories','settings'];
  state.ui.route = valid.includes(h) ? h : 'dashboard';
}
window.addEventListener('hashchange', () => { routeFromHash(); render(); });
window.addEventListener('resize', () => { render(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.ui.modal) { closeModal(); }
});
// Listen to system color scheme
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    if (!localStorage.getItem('sf_theme')) { state.theme = e.matches ? 'dark' : 'light'; applyTheme(); render(); }
  });
}

loadState();
routeFromHash();
processRecurring();
render();
</script>
</body>
</html>
